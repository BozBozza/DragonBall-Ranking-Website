<!DOCTYPE html>
<html>
<head>
    <title>Character Rankings</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<h1 style="text-align:center">Dragon Ball Power Level Flow Chart</h1>

<a href="../index.html" class="button-link">Power Levels</a>

<div id="flow-scroll">
    <div id="flow-canvas">
        <svg id="flow-arrows" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="flow-grid"></div>
    </div>
</div>

<script>
    const SVG_NS = 'http://www.w3.org/2000/svg';

    let graph = null;

    async function loadChart() {
        try {
            const response = await fetch('chart.json');
            graph = buildGraph(await response.json());
            classifyEdges(graph);
            layOut(graph);
            renderGrid(graph);
            drawArrows(graph);
        } catch (error) {
            console.error("Error loading characters:", error);
        }
    }

    // ---- graph ----

    // characters that neither link to anything nor are linked to are left out
    function buildGraph(chars) {
        const indexByName = new Map();
        chars.forEach((char, index) => {
            if (!indexByName.has(char.name)) indexByName.set(char.name, index);
        });

        const rawEdges = [];
        chars.forEach((char, from) => {
            (char.links || []).forEach(link => {
                if (!link || !link.to) return;

                const to = indexByName.get(link.to);
                if (to === undefined) {
                    console.warn(`"${char.name}" links to unknown character "${link.to}"`);
                    return;
                }
                if (to === from) return;

                rawEdges.push({ from, to, description: link.description || '' });
            });
        });

        const connected = new Set();
        rawEdges.forEach(edge => {
            connected.add(edge.from);
            connected.add(edge.to);
        });

        const kept = chars.map((char, index) => index).filter(index => connected.has(index));
        const reindex = new Map(kept.map((oldIndex, newIndex) => [oldIndex, newIndex]));

        return {
            nodes: kept.map(index => chars[index]),
            // where each shown character sits in the file, which is what decides
            // whether a link is a step along the row or a jump up a tier
            origin: kept,
            edges: rawEdges.map(edge => ({
                ...edge,
                from: reindex.get(edge.from),
                to: reindex.get(edge.to)
            }))
        };
    }

    // a link to the neighbouring entry in chart.json is a step along the row;
    // a link to anything further off is a jump, which leaves the top or bottom
    // of the character rather than its side
    function classifyEdges({ edges, origin }) {
        edges.forEach(edge => {
            edge.jump = Math.abs(origin[edge.to] - origin[edge.from]) !== 1;
        });
    }

    // every character keeps a column of its own, in chart.json order, so power
    // levels climb from left to right; only the tier changes
    function layOut(chart) {
        const { nodes, edges } = chart;

        const jumpsFrom = nodes.map(() => []);
        const liftedBy = new Set();
        edges.filter(edge => edge.jump).forEach(edge => {
            jumpsFrom[edge.from].push(edge);
            liftedBy.add(edge.to);
        });

        const column = nodes.map((node, index) => index);
        const tier = nodes.map(() => null);

        // the first character jumped to sits above, the second below, and any
        // after that further out again, so no two share a tier
        const lift = index => {
            let taken = 0;
            jumpsFrom[index].forEach(edge => {
                if (tier[edge.to] !== null) return;

                const reach = Math.floor(taken / 2) + 1;
                tier[edge.to] = tier[index] + (taken % 2 === 0 ? reach : -reach);
                taken++;
                lift(edge.to);
            });
        };

        nodes.forEach((node, index) => {
            if (tier[index] !== null || liftedBy.has(index)) return;
            tier[index] = 0;
            lift(index);
        });

        // anything still waiting is caught in a loop of jumps, so leave it in the row
        nodes.forEach((node, index) => {
            if (tier[index] !== null) return;
            tier[index] = 0;
            lift(index);
        });

        chart.column = column;
        chart.tier = tier;
    }

    function renderGrid({ nodes, column, tier }) {
        const grid = document.getElementById('flow-grid');
        const topTier = Math.max(...tier);

        grid.innerHTML = nodes.map((node, index) => `
            <div class="flow-node" data-index="${index}" style="grid-column:${column[index] + 1}; grid-row:${topTier - tier[index] + 1}; border:3px solid ${node.border};">
                <span class="flow-name">${node.name}</span>
                <span class="flow-power">${node.powerlevel}</span>
            </div>
        `).join('');
    }

    // ---- arrows ----

    const ARC_BASE = 50;
    const ARC_STEP = 30;
    const NODE_INSET = 7;
    const LANE_INSET = 34;
    const LANE_STEP = 34;
    const CORNER = 14;

    const arcHeight = edge => ARC_BASE + edge.level * ARC_STEP;

    // a step to the neighbouring column runs straight through the gap, unless an
    // arrow already crosses it the other way; a link to a character on another
    // tier leaves the top or bottom and runs across to it; anything left over has
    // to arc over the nodes in between
    function planEdges(edges, column, tier) {
        const gaps = new Map();

        edges.forEach(edge => {
            const across = column[edge.to] - column[edge.from];

            if (!edge.jump && Math.abs(across) === 1) {
                const gap = `${tier[edge.from]}:${Math.min(column[edge.from], column[edge.to])}`;
                const heading = Math.sign(across);
                const claimed = gaps.get(gap);

                if (claimed === undefined || claimed === heading) {
                    edge.shape = 'direct';
                    gaps.set(gap, heading);
                    return;
                }
            }

            edge.shape = tier[edge.to] === tier[edge.from] ? 'arc' : 'jump';
        });

        const jumps = edges.filter(edge => edge.shape === 'jump');
        jumps.forEach(edge => { edge.rising = tier[edge.to] > tier[edge.from]; });

        assignLanes(jumps, column, tier);
        shareEdges(jumps);
        assignArcLevels(edges.filter(edge => edge.shape === 'arc'), column);

        return Math.max(0, ...jumps.map(edge => edge.lane + 1));
    }

    // a jump crosses the empty band between two tiers, and each one gets a lane of
    // its own in that band. The widest runs take the lanes nearest the character
    // they point at, so a shorter run never has to cross one to reach its lane.
    function assignLanes(jumps, column, tier) {
        const span = edge => Math.abs(column[edge.to] - column[edge.from]);
        const bands = new Map();

        [...jumps].sort((a, b) => span(b) - span(a)).forEach(edge => {
            const band = `${tier[edge.to]}:${edge.rising}`;
            const used = bands.get(band) || [];
            const start = Math.min(column[edge.from], column[edge.to]);
            const end = Math.max(column[edge.from], column[edge.to]);

            let lane = 0;
            while (used.some(run => run.lane === lane && start <= run.end && run.start <= end)) {
                lane++;
            }
            edge.lane = lane;
            used.push({ start, end, lane });
            bands.set(band, used);
        });
    }

    // jumps leaving one character the same way, or landing on the same one, are
    // fanned out along its edge rather than stacked on the same line
    function shareEdges(jumps) {
        const fan = (keyOf, assign) => {
            const groups = new Map();
            jumps.forEach(edge => {
                const key = keyOf(edge);
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(edge);
            });
            groups.forEach(group => group.forEach((edge, position) => {
                assign(edge, group.length === 1 ? 0 : (position + 1) / (group.length + 1) - 0.5);
            }));
        };

        fan(edge => `${edge.from}:${edge.rising}`, (edge, offset) => { edge.exit = offset; });
        fan(edge => `${edge.to}:${edge.rising}`, (edge, offset) => { edge.entry = offset; });
    }

    // arcs crossing the same columns are stacked so they never overlap
    function assignArcLevels(arcs, column) {
        const placed = [];
        arcs.forEach(edge => {
            const start = Math.min(column[edge.from], column[edge.to]);
            const end = Math.max(column[edge.from], column[edge.to]) + 1;

            let level = 0;
            while (placed.some(arc => arc.level === level && start < arc.end && arc.start < end)) {
                level++;
            }
            edge.level = level;
            placed.push({ start, end, level });
        });
    }

    function drawArrows({ edges, column, tier }) {
        const canvas = document.getElementById('flow-canvas');
        const svg = document.getElementById('flow-arrows');
        const cells = new Map(
            [...document.querySelectorAll('.flow-node')].map(cell => [Number(cell.dataset.index), cell])
        );

        const lanes = planEdges(edges, column, tier);

        // open the tiers up far enough for every lane to run between them
        document.getElementById('flow-grid').style.rowGap =
            2 * LANE_INSET + Math.max(0, lanes - 1) * LANE_STEP + 'px';

        // reserve room above the nodes for the tallest arc and its label
        const tallestArc = Math.max(
            0,
            ...edges.filter(edge => edge.shape === 'arc').map(arcHeight)
        );
        canvas.style.paddingTop = Math.round(tallestArc * 0.8) + 60 + 'px';

        canvas.querySelectorAll('.flow-label').forEach(label => label.remove());
        svg.innerHTML = '';

        const defs = document.createElementNS(SVG_NS, 'defs');
        svg.appendChild(defs);
        const head = arrowMarker(defs);

        const frame = canvas.getBoundingClientRect();

        edges.forEach(edge => {
            const source = box(cells.get(edge.from), frame);
            const target = box(cells.get(edge.to), frame);

            const shape = { jump: jumpArrow, direct: directArrow, arc: arcArrow }[edge.shape];
            const { path, labelX, labelY } = shape(source, target, edge);

            const line = document.createElementNS(SVG_NS, 'path');
            line.setAttribute('d', path);
            line.setAttribute('class', 'flow-arrow');
            line.setAttribute('marker-end', `url(#${head})`);
            svg.appendChild(line);

            if (edge.description) {
                canvas.appendChild(makeLabel(edge.description, labelX, labelY));
            }
        });

        svg.setAttribute('width', canvas.scrollWidth);
        svg.setAttribute('height', canvas.scrollHeight);
    }

    // node geometry relative to the canvas
    function box(cell, frame) {
        const rect = cell.getBoundingClientRect();
        const left = rect.left - frame.left;
        const top = rect.top - frame.top;
        return {
            left,
            right: left + rect.width,
            top,
            bottom: top + rect.height,
            centreX: left + rect.width / 2,
            centreY: top + rect.height / 2
        };
    }

    // out of the top (or the bottom) of the source, along its lane in the band
    // between the two tiers, then into the edge of the character it points at
    function jumpArrow(source, target, edge) {
        const up = edge.rising;
        const sx = source.centreX + edge.exit * (source.right - source.left) * 0.6;
        const tx = target.centreX + edge.entry * (target.right - target.left) * 0.6;

        const start = up ? source.top - NODE_INSET : source.bottom + NODE_INSET;
        const finish = up ? target.bottom + NODE_INSET : target.top - NODE_INSET;
        const lane = up
            ? target.bottom + LANE_INSET + edge.lane * LANE_STEP
            : target.top - LANE_INSET - edge.lane * LANE_STEP;

        const climb = up ? -1 : 1;
        const heading = Math.sign(tx - sx) || 1;
        const corner = Math.min(
            CORNER,
            Math.abs(tx - sx) / 2,
            Math.abs(lane - start),
            Math.abs(finish - lane)
        );

        return {
            path: [
                `M ${sx} ${start}`,
                `L ${sx} ${lane - climb * corner}`,
                `Q ${sx} ${lane}, ${sx + heading * corner} ${lane}`,
                `L ${tx - heading * corner} ${lane}`,
                `Q ${tx} ${lane}, ${tx} ${lane + climb * corner}`,
                `L ${tx} ${finish}`
            ].join(' '),
            labelX: (sx + tx) / 2,
            labelY: lane
        };
    }

    // leaves the source horizontally and arrives horizontally, so stacked
    // targets fan out from a single node
    function directArrow(source, target) {
        const rightward = target.left >= source.right;
        const x1 = rightward ? source.right + NODE_INSET : source.left - NODE_INSET;
        const x2 = rightward ? target.left - NODE_INSET : target.right + NODE_INSET;
        const reach = (x2 - x1) / 2;
        return {
            path: `M ${x1} ${source.centreY} C ${x1 + reach} ${source.centreY}, ${x2 - reach} ${target.centreY}, ${x2} ${target.centreY}`,
            labelX: (x1 + x2) / 2,
            labelY: (source.centreY + target.centreY) / 2
        };
    }

    function arcArrow(source, target, edge) {
        const height = arcHeight(edge);
        const y1 = source.top;
        const y2 = target.top - NODE_INSET;
        // a cubic with both handles lifted by `height` peaks at 0.75 * height
        const apex = Math.min(y1, y2) - height * 0.75;
        return {
            path: `M ${source.centreX} ${y1} C ${source.centreX} ${y1 - height}, ${target.centreX} ${y2 - height}, ${target.centreX} ${y2}`,
            labelX: (source.centreX + target.centreX) / 2,
            labelY: apex
        };
    }

    function makeLabel(text, x, y) {
        const label = document.createElement('div');
        label.className = 'flow-label';
        label.textContent = text;
        label.style.left = x + 'px';
        label.style.top = y + 'px';
        return label;
    }

    function arrowMarker(defs) {
        const id = 'arrow-head';

        const marker = document.createElementNS(SVG_NS, 'marker');
        marker.setAttribute('id', id);
        marker.setAttribute('viewBox', '0 0 10 10');
        marker.setAttribute('refX', '9');
        marker.setAttribute('refY', '5');
        marker.setAttribute('markerWidth', '5');
        marker.setAttribute('markerHeight', '5');
        marker.setAttribute('orient', 'auto-start-reverse');

        const point = document.createElementNS(SVG_NS, 'path');
        point.setAttribute('d', 'M 0 0 L 10 5 L 0 10 z');
        point.setAttribute('class', 'flow-arrow-head');
        marker.appendChild(point);

        defs.appendChild(marker);
        return id;
    }

    // node positions shift with the viewport, so the arrows are re-measured
    let redrawTimer = null;
    window.addEventListener('resize', () => {
        clearTimeout(redrawTimer);
        redrawTimer = setTimeout(() => { if (graph) drawArrows(graph); }, 150);
    });

    loadChart();
</script>
</body>
</html>
