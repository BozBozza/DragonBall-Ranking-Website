<!DOCTYPE html>
<html>
<head>
    <title>Character Rankings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 style="text-align:center">Dragon Ball All Power Levels</h1>

<a href="multipliers/multipliers.html" class="button-link">Multipliers</a>
<a href="info.html" class="button-link">Info</a>
<a href="highball/highball.html" class="button-link">High Ball</a>
<a href="chart/chart.html" class="button-link">Chart</a><br>

<div id="series-filter-menu"></div>

<div id="character-filter-menu"></div>

<div id="character-container"></div>

<div id="wiki-preview"></div>


<script>
    let allCharacters = [];

    async function loadCharacters() {
        try {
            const response = await fetch('powerlevels.json');
            allCharacters = await response.json();
            createSeriesFilterMenu();
            renderDisplay(allCharacters);
        } catch (error) {
            console.error("Error loading characters:", error);
        }
    }

    const seriesColors = [
        { name: 'Dragon Ball AF', color: '#000000'},
        { name: 'Dragon Ball GT', color: '#B42B2B' },
        { name: 'Dragon Ball Super', color: '#7982EA' },
        { name: 'Dragon Ball Daima', color: '#9E64E0' },
        { name: 'Dragon Ball Movies', color: '#98B17B' },
        { name: 'Dragon Ball Z', color: '#ea841b' },
        { name: 'Original Dragon Ball', color: '#C6C485' },
    ];
    // colours of the series currently toggled on
    const activeSeries = new Set();

    function createSeriesFilterMenu() {
        const menu = document.getElementById('series-filter-menu');
        // every series starts toggled on
        menu.innerHTML = seriesColors.map(series => {
            activeSeries.add(series.color.toUpperCase());
            return `
            <button class="filter-btn series-toggle active" data-color="${series.color}" style="background:${series.color}" onclick="toggleSeries('${series.color}')">${series.name}</button>
        `;
        }).join('');
    }

    function toggleSeries(color) {
        const key = color.toUpperCase();
        const btn = document.querySelector(`.series-toggle[data-color="${color}"]`);
        if (activeSeries.has(key)) {
            activeSeries.delete(key);
            btn.style.background = '';
            btn.classList.remove('active');
        } else {
            activeSeries.add(key);
            btn.style.background = color;
            btn.classList.add('active');
        }
        applySeriesFilter();
    }

    function applySeriesFilter() {
        // nothing toggled on -> show nothing
        const filtered = allCharacters.filter(char => activeSeries.has(char.border.toUpperCase()));
        renderDisplay(filtered);
    }

    function renderDisplay(dataToShow) {
        const container = document.getElementById('character-container');

        container.innerHTML = dataToShow.map((char, index) => `
            <div class="character-card" style="border:3px solid ${char.border};">
                <span class="powerlevel">${char.powerlevel}</span>
                <img src="${char.image}" style="border:3px solid ${char.border};" data-index="${index}">
                <h2>${char.name}</h2>
                <p>${char.form}</p>
                <p>${char.info}</p>
            </div>
        `).join('');

        // remember which list is currently on screen, so the preview can look up details
        currentlyShown = dataToShow;
    }

    // ---- Wikipedia-style hover preview ----
    let currentlyShown = [];
    let previewTimer = null;

    const preview = document.getElementById('wiki-preview');

    document.addEventListener('mouseover', (e) => {
        const img = e.target.closest('.character-card img');
        if (!img) return;

        const char = currentlyShown[img.dataset.index];
        if (!char) return;

        // small delay before showing, like Wikipedia
        clearTimeout(previewTimer);
        previewTimer = setTimeout(() => {
            preview.innerHTML = `
                <img src="${char.image}">
                <p>${char.description ?? 'null'}</p>
            `;
            positionPreview(img);
            preview.style.display = 'block';
        }, 300);
    });

    document.addEventListener('mouseout', (e) => {
        const img = e.target.closest('.character-card img');
        if (!img) return;
        clearTimeout(previewTimer);
        preview.style.display = 'none';
    });

    function positionPreview(img) {
        const rect = img.getBoundingClientRect();
        // make it visible but off-screen so we can measure its size
        preview.style.display = 'block';
        preview.style.left = '-9999px';
        const pw = preview.offsetWidth;
        const ph = preview.offsetHeight;

        // prefer to the right of the image; flip left if it would go off screen
        let left = rect.right + 12;
        if (left + pw > window.innerWidth) {
            left = rect.left - pw - 12;
        }
        // vertically centre on the image, but keep it on screen
        let top = rect.top + rect.height / 2 - ph / 2;
        top = Math.max(10, Math.min(top, window.innerHeight - ph - 10));

        preview.style.left = left + 'px';
        preview.style.top = top + 'px';
    }

    loadCharacters();
</script>
</body>
</html>
